 <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expenses</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="app-header">
            <h1>Daily Expenses</h1>
            <div id="currentDateTime"></div>
        </header>

        <main>

            <section class="expense-form">

                <h2>Νέα Έξοδο</h2>

                <label for="amount">Ποσό (€)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    step="0.01"
                    min="0"
                >

                <label for="paymentMethod">Τρόπος πληρωμής</label>

                <select id="paymentMethod">
                    <option value="cash">Μετρητά</option>
                    <option value="card">Κάρτα</option>
                </select>

                <label for="category">Κατηγορία</label>

                <select id="category">
                    <option value="">-- Προαιρετικό --</option>
                    <option value="fuel">Βενζίνη</option>
                    <option value="food">Φαγητό</option>
                    <option value="tickets">Εισιτήρια</option>
                    <option value="coffee">Καφέ</option>
                    <option value="shopping">Αγορά</option>
                    <option value="maintenance">Συντήρηση οχήματος</option>
                    <option value="other">Διάφορα</option>
                </select>

                <div id="vehicleContainer" class="hidden">

                    <label for="vehicle">Όχημα</label>

                    <select id="vehicle">
                        <option value="">-- Επιλέξτε --</option>
                        <option value="car">Αυτοκίνητο</option>
                        <option value="motorcycle">Μηχανή</option>
                    </select>

                </div>

                <label for="description">Περιγραφή</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Προαιρετική περιγραφή"
                >

                <button id="addExpenseButton">
                    ➕ Προσθήκη
                </button>

            </section>


            <section class="calendar-section">

                <h2>Ημερολόγιο</h2>

                <input
                    type="date"
                    id="selectedDate"
                >

                <div id="daySummary"></div>

                <div id="expenseList"></div>

            </section>


            <section class="reports-section">

                <h2>📄 Reports / PDF</h2>

                <label for="reportType">Τύπος Report</label>

                <select id="reportType">
                    <option value="day">Ημερήσιο</option>
                    <option value="week">Εβδομαδιαίο</option>
                    <option value="month">Μηνιαίο</option>
                    <option value="year">Ετήσιο</option>
                    <option value="custom">Συγκεκριμένη περίοδος</option>
                </select>

                <label for="reportCategory">Κατηγορία</label>

                <select id="reportCategory">
                    <option value="all">Όλες</option>
                    <option value="fuel">Βενζίνη</option>
                    <option value="food">Φαγητό</option>
                    <option value="tickets">Εισιτήρια</option>
                    <option value="coffee">Καφέ</option>
                    <option value="shopping">Αγορά</option>
                    <option value="maintenance">Συντήρηση οχήματος</option>
                    <option value="other">Διάφορα</option>
                </select>

                <label for="reportVehicle">Όχημα</label>

                <select id="reportVehicle">
                    <option value="all">Όλα</option>
                    <option value="car">Αυτοκίνητο</option>
                    <option value="motorcycle">Μηχανή</option>
                </select>

                <label for="reportPayment">Τρόπος πληρωμής</label>

                <select id="reportPayment">
                    <option value="all">Όλα</option>
                    <option value="cash">Μετρητά</option>
                    <option value="card">Κάρτα</option>
                </select>

                <div id="reportDates">

                    <label for="reportStartDate">Από</label>
                    <input type="date" id="reportStartDate">

                    <label for="reportEndDate">Έως</label>
                    <input type="date" id="reportEndDate">

                </div>

                <button id="generateReportButton">
                    📄 Δημιουργία Report PDF
                </button>

            </section>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
