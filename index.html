<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2937">
  <title>Daily Expenses</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="app-header">
    <div>
      <h1>Daily Expenses</h1>
      <div id="currentDateTime"></div>
    </div>

    <button id="settingsButton" class="secondary">
      ⚙️ Ρυθμίσεις
    </button>
  </header>


  <main>

    <!-- ========================= -->
    <!-- NEW EXPENSE -->
    <!-- ========================= -->

    <section class="card">

      <h2>Νέο Έξοδο</h2>

      <div class="grid">

        <div>
          <label>Ποσό (€)</label>
          <input
            type="number"
            id="amount"
            step="0.01"
            min="0"
            inputmode="decimal"
          >
        </div>


        <div>
          <label>Πώς πληρώνω;</label>

          <select id="paymentMethod"></select>
        </div>


        <div>
          <label>Κατηγορία</label>

          <select id="category"></select>
        </div>


        <div id="subcategoryWrap" class="hidden">

          <label>Υποκατηγορία</label>

          <select id="subcategory"></select>

        </div>


        <div id="vehicleWrap" class="hidden">

          <label>Όχημα</label>

          <select id="vehicle"></select>

        </div>


        <div id="litersWrap" class="hidden">

          <label>Λίτρα καυσίμου</label>

          <input
            type="number"
            id="liters"
            step="0.01"
            min="0"
          >

        </div>


        <div id="odometerWrap" class="hidden">

          <label>Χιλιόμετρα οχήματος</label>

          <input
            type="number"
            id="odometer"
            step="1"
            min="0"
          >

        </div>


        <div>

          <label>Για ποιον;</label>

          <select id="person"></select>

        </div>


        <div>

          <label>Τρόπος αγοράς</label>

          <select id="purchaseMethod">

            <option value="store">
              Φυσικό κατάστημα
            </option>

            <option value="internet">
              Internet
            </option>

          </select>

        </div>


        <div id="shopWrap">

          <label>Κατάστημα / Ιστοσελίδα</label>

          <input
            type="text"
            id="shop"
            placeholder="π.χ. Σκλαβενίτης, Amazon..."
          >

        </div>


        <div id="orderWrap" class="hidden">

          <label>Αριθμός παραγγελίας</label>

          <input
            type="text"
            id="orderNumber"
          >

        </div>


        <div id="orderStatusWrap" class="hidden">

          <label>Κατάσταση παραγγελίας</label>

          <select id="orderStatus">

            <option>Παραγγέλθηκε</option>
            <option>Αναμένεται</option>
            <option>Παραδόθηκε</option>
            <option>Ακυρώθηκε</option>
            <option>Επιστράφηκε</option>

          </select>

        </div>


        <div class="wide">

          <label>Περιγραφή</label>

          <input
            type="text"
            id="description"
            placeholder="Προαιρετική περιγραφή"
          >

        </div>

      </div>


      <button
        id="addExpenseButton"
        class="primary"
      >
        ➕ Προσθήκη εξόδου
      </button>

    </section>


    <!-- ========================= -->
    <!-- CALENDAR -->
    <!-- ========================= -->

    <section class="card">

      <h2>Ημερολόγιο</h2>

      <label>Ημερομηνία</label>

      <input
        type="date"
        id="selectedDate"
      >

      <div id="daySummary"></div>

      <div id="expenseList"></div>

    </section>


    <!-- ========================= -->
    <!-- REPORTS -->
    <!-- ========================= -->

    <section class="card">

      <h2>📄 Reports / PDF</h2>

      <div class="grid">

        <div>

          <label>Τύπος Report</label>

          <select id="reportType">

            <option value="day">
              Ημερήσιο
            </option>

            <option value="week">
              Εβδομαδιαίο
            </option>

            <option value="month">
              Μηνιαίο
            </option>

            <option value="year">
              Ετήσιο
            </option>

            <option value="custom">
              Συγκεκριμένη περίοδος
            </option>

          </select>

        </div>


        <div>

          <label>Κατηγορία</label>

          <select id="reportCategory"></select>

        </div>


        <div>

          <label>Για ποιον</label>

          <select id="reportPerson"></select>

        </div>


        <div>

          <label>Τρόπος πληρωμής</label>

          <select id="reportPayment"></select>

        </div>


        <div>

          <label>Από</label>

          <input
            type="date"
            id="reportStartDate"
          >

        </div>


        <div>

          <label>Έως</label>

          <input
            type="date"
            id="reportEndDate"
          >

        </div>

      </div>


      <button
        id="generateReportButton"
        class="primary"
      >
        📄 Δημιουργία Report PDF
      </button>

    </section>

  </main>

</div>


<!-- ========================= -->
<!-- SETTINGS MODAL -->
<!-- ========================= -->

<div
  id="settingsModal"
  class="modal hidden"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2>⚙️ Ρυθμίσεις</h2>

      <button
        id="closeSettings"
        class="secondary"
      >
        ✕
      </button>

    </div>


    <p class="muted">
      Εδώ αλλάζεις τις παραμέτρους χωρίς να πειράζεις τον κώδικα.
    </p>


    <div class="settings-grid">


      <!-- PAYMENT METHODS -->

      <div>

        <h3>Τρόποι πληρωμής</h3>

        <div id="paymentSettings"></div>

        <div class="add-row">

          <input
            id="newPayment"
            placeholder="Νέος τρόπος πληρωμής"
          >

          <button id="addPayment">
            ➕
          </button>

        </div>

      </div>


      <!-- CATEGORIES -->

      <div>

        <h3>Κατηγορίες</h3>

        <div id="categorySettings"></div>

        <div class="add-row">

          <input
            id="newCategory"
            placeholder="Νέα κατηγορία"
          >

          <button id="addCategory">
            ➕
          </button>

        </div>

      </div>


      <!-- PERSONS -->

      <div>

        <h3>Άτομα / Παραλήπτες εξόδων</h3>

        <div id="personSettings"></div>

        <div class="add-row">

          <input
            id="newPerson"
            placeholder="Νέο άτομο"
          >

          <button id="addPerson">
            ➕
          </button>

        </div>

      </div>


      <!-- VEHICLES -->

      <div>

        <h3>Οχήματα</h3>

        <div id="vehicleSettings"></div>

        <div class="add-row">

          <input
            id="newVehicle"
            placeholder="Νέο όχημα"
          >

          <button id="addVehicle">
            ➕
          </button>

        </div>

      </div>


      <!-- SUBCATEGORIES -->

      <div>

        <h3>Υποκατηγορίες αγορών</h3>

        <div id="subcategorySettings"></div>

        <div class="add-row">

          <input
            id="newSubcategory"
            placeholder="π.χ. Super Market"
          >

          <button id="addSubcategory">
            ➕
          </button>

        </div>

      </div>


    </div>


    <div class="modal-actions">

      <button
        id="exportData"
        class="secondary"
      >
        💾 Εξαγωγή δεδομένων
      </button>


      <button
        id="importDataButton"
        class="secondary"
      >
        📥 Εισαγωγή δεδομένων
      </button>


      <input
        type="file"
        id="importData"
        accept=".json"
        class="hidden"
      >


      <button
        id="resetSettings"
        class="danger"
      >
        Επαναφορά παραμέτρων
      </button>

    </div>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
