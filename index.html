<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="apple-touch-icon" href="DailyExpences.PNG">
<link rel="icon" type="image/png" href="DailyExpences.PNG">

<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Daily Expenses</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header class="app-header">

    <div class="header-title">

        <h1>
            Daily Expenses
        </h1>

        <div id="currentDateTime"></div>

    </div>


    <button
        type="button"
        id="settingsButton"
        class="secondary">

        Ρυθμίσεις

    </button>

</header>


<main>


<!-- =====================================================
     ΝΕΑ ΠΛΗΡΩΜΗ
     ===================================================== -->

<section class="card">

    <h2>
        Νέα πληρωμή
    </h2>


    <div class="grid">


        <div>

            <label for="amount">
                Ποσό (€)
            </label>

            <input
                type="number"
                id="amount"
                step="0.01"
                min="0"
                inputmode="decimal"
                autocomplete="off">

        </div>


        <div>

            <label for="paymentMethod">
                Πώς πληρώνω;
            </label>

            <select id="paymentMethod">
            </select>

        </div>


        <div>

            <label for="category">
                Κατηγορία
            </label>

            <select id="category">
            </select>

        </div>


        <!-- ΑΓΟΡΕΣ -->

        <div
            id="subcategoryWrap"
            class="hidden">

            <label for="subcategory">
                Τι είδους αγορά;
            </label>

            <select id="subcategory">
            </select>

        </div>


        <!-- ΤΥΠΟΣ ΟΧΗΜΑΤΟΣ -->

        <div
            id="vehicleTypeWrap"
            class="hidden">

            <label for="vehicleType">
                Τύπος οχήματος
            </label>

            <select id="vehicleType">

                <option value="">
                    Επιλέξτε τύπο οχήματος
                </option>

                <option value="Αυτοκίνητο">
                    Αυτοκίνητο
                </option>

                <option value="Μηχανή">
                    Μηχανή
                </option>

            </select>

        </div>


        <!-- ΣΥΓΚΕΚΡΙΜΕΝΟ ΟΧΗΜΑ -->

        <div
            id="vehicleWrap"
            class="hidden">

            <label for="vehicle">
                Ποιο όχημα;
            </label>

            <select id="vehicle">
            </select>


            <div
                id="vehicleEmptyMessage"
                class="vehicle-empty-message hidden">

                Δεν έχει καταχωρηθεί όχημα
                αυτού του τύπου.
                Πρόσθεσέ το από τις Ρυθμίσεις.

            </div>

        </div>


        <!-- ΕΙΔΟΣ ΔΑΠΑΝΗΣ -->

        <div
            id="vehicleExpenseTypeWrap"
            class="hidden">

            <label for="vehicleExpenseType">
                Είδος δαπάνης
            </label>

            <select id="vehicleExpenseType">

                <option value="">
                    Επιλέξτε είδος δαπάνης
                </option>

                <option value="Βενζίνη">
                    Βενζίνη
                </option>

                <option value="Έξοδα συντήρησης">
                    Έξοδα συντήρησης
                </option>

            </select>

        </div>


        <!-- ΚΟΝΤΕΡ -->

        <div
            id="odometerWrap"
            class="hidden">

            <label for="odometer">
                Κοντέρ (km)
            </label>

            <input
                type="number"
                id="odometer"
                step="1"
                min="0"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Προαιρετικό">

        </div>


        <!-- ΓΙΑ ΠΟΙΟΝ -->

        <div>

            <label for="person">
                Για ποιον;
            </label>

            <select id="person">
            </select>

        </div>


        <!-- ΤΡΟΠΟΣ ΑΓΟΡΑΣ -->

        <div>

            <label for="purchaseMethod">
                Τρόπος αγοράς
            </label>

            <select id="purchaseMethod">

                <option value="store">
                    Φυσικό κατάστημα
                </option>

                <option value="internet">
                    Internet
                </option>

            </select>

        </div>


        <!-- ΚΑΤΑΣΤΗΜΑ -->

        <div>

            <label for="shop">
                Κατάστημα / Ιστοσελίδα
            </label>

            <input
                type="text"
                id="shop"
                placeholder="Προαιρετικό"
                autocomplete="off">

        </div>


        <!-- ΠΑΡΑΓΓΕΛΙΑ -->

        <div
            id="orderWrap"
            class="hidden">

            <label for="orderNumber">
                Αριθμός παραγγελίας
            </label>

            <input
                type="text"
                id="orderNumber"
                autocomplete="off">

        </div>


        <div
            id="orderStatusWrap"
            class="hidden">

            <label for="orderStatus">
                Κατάσταση παραγγελίας
            </label>

            <select id="orderStatus">

                <option value="Παραγγέλθηκε">
                    Παραγγέλθηκε
                </option>

                <option value="Αναμένεται">
                    Αναμένεται
                </option>

                <option value="Παραδόθηκε">
                    Παραδόθηκε
                </option>

                <option value="Ακυρώθηκε">
                    Ακυρώθηκε
                </option>

                <option value="Επιστράφηκε">
                    Επιστράφηκε
                </option>

            </select>

        </div>


        <!-- ΠΕΡΙΓΡΑΦΗ -->

        <div class="wide">

            <label for="description">
                Περιγραφή
            </label>

            <input
                type="text"
                id="description"
                placeholder="Προαιρετική περιγραφή"
                autocomplete="off">

        </div>

    </div>

<div id="editDateTimeWrap" class="grid hidden">

    <div>
        <label for="editExpenseDate">
            Ημερομηνία πληρωμής
        </label>

        <input
            type="date"
            id="editExpenseDate">
    </div>

    <div>
        <label for="editExpenseTime">
            Ώρα πληρωμής
        </label>

        <input
            type="time"
            id="editExpenseTime">
    </div>

</div>

    <button
        type="button"
        id="addExpenseButton"
        class="primary">

        <span
            class="button-plus"
            aria-hidden="true">+</span>

        Προσθήκη εξόδου

    </button>

</section>


<!-- =====================================================
     ΗΜΕΡΟΛΟΓΙΟ
     ===================================================== -->

<section class="card">

    <h2>
        Ημερολόγιο
    </h2>


    <label for="selectedDate">
        Ημερομηνία
    </label>

    <input
        type="date"
        id="selectedDate">


    <div id="daySummary"></div>

    <div id="expenseList"></div>

</section>


<!-- =====================================================
     REPORTS
     ===================================================== -->

<section class="card">

    <h2>
        Reports
    </h2>


    <div class="grid">


        <!-- ΠΕΡΙΟΔΟΣ -->

        <div>

            <label for="reportType">
                Περίοδος
            </label>

            <select id="reportType">

                <option value="day">
                    Ημέρα
                </option>

                <option value="week">
                    Εβδομάδα
                </option>

                <option value="month">
                    Μήνας
                </option>

                <option value="year">
                    Έτος
                </option>

                <option value="custom">
                    Από - Έως
                </option>

            </select>

        </div>


        <!-- ΚΑΤΗΓΟΡΙΑ -->

        <div>

            <label for="reportCategory">
                Κατηγορία
            </label>

            <select id="reportCategory">
            </select>

        </div>


        <!--
             ΠΟΛΥ ΣΗΜΑΝΤΙΚΟ:
             Το Όχημα έχει πλέον δικό του wrapper.
             Εμφανίζεται ΜΟΝΟ όταν:
             reportCategory = Οχήματα
        -->

        <div
            id="reportVehicleWrap"
            class="hidden">

            <label for="reportVehicle">
                Όχημα
            </label>

            <select id="reportVehicle">
            </select>

        </div>


        <!-- ΕΙΔΟΣ ΔΑΠΑΝΗΣ ΟΧΗΜΑΤΟΣ -->

        <div
            id="reportVehicleExpenseWrap"
            class="hidden">

            <label for="reportVehicleExpense">
                Είδος δαπάνης οχήματος
            </label>

            <select id="reportVehicleExpense">

                <option value="all">
                    Όλα
                </option>

                <option value="Βενζίνη">
                    Βενζίνη
                </option>

                <option value="Έξοδα συντήρησης">
                    Έξοδα συντήρησης
                </option>

            </select>

        </div>


        <!-- ΓΙΑ ΠΟΙΟΝ -->

        <div>

            <label for="reportPerson">
                Για ποιον
            </label>

            <select id="reportPerson">
            </select>

        </div>


        <!-- ΤΡΟΠΟΣ ΠΛΗΡΩΜΗΣ -->

        <div>

            <label for="reportPayment">
                Τρόπος πληρωμής
            </label>

            <select id="reportPayment">
            </select>

        </div>


        <!-- ΑΠΟ -->

        <div>

            <label for="reportStartDate">
                Από
            </label>

            <input
                type="date"
                id="reportStartDate">

        </div>


        <!-- ΕΩΣ -->

        <div>

            <label for="reportEndDate">
                Έως
            </label>

            <input
                type="date"
                id="reportEndDate">

        </div>

    </div>


    <!-- =================================================
         ΤΙ ΘΕΛΩ ΝΑ ΕΜΦΑΝΙΖΕΙ ΤΟ REPORT
         ================================================= -->

    <div class="report-options">

        <h3>
            Τι θέλω να εμφανίζει το Report;
        </h3>


        <!-- ΠΡΟΕΠΙΛΕΓΜΕΝΟ -->

        <label class="check-option">

            <input
                type="checkbox"
                id="reportShowPayments"
                checked>

            Αναλυτικές πληρωμές

        </label>


        <!-- ΠΡΟΕΠΙΛΕΓΜΕΝΟ -->

        <label class="check-option">

            <input
                type="checkbox"
                id="reportShowCategories"
                checked>

            Σύνολα ανά κατηγορία

        </label>


        <!-- ΠΡΟΕΠΙΛΕΓΜΕΝΟ -->

        <label class="check-option">

            <input
                type="checkbox"
                id="reportShowSubcategories"
                checked>

            Σύνολα ανά υποκατηγορία

        </label>


        <!-- ΜΟΝΟ ΓΙΑ ΟΧΗΜΑΤΑ -->

        <label
            class="check-option vehicle-report-option hidden">

            <input
                type="checkbox"
                id="reportShowVehicles">

            Σύνολα ανά όχημα

        </label>


        <label
            class="check-option vehicle-report-option hidden">

            <input
                type="checkbox"
                id="reportShowOdometer">

            Χιλιόμετρα / κοντέρ

        </label>


        <label
            class="check-option vehicle-report-option hidden">

            <input
                type="checkbox"
                id="reportShowCostPerKm">

            Κόστος ανά χιλιόμετρο

        </label>


        <label
            class="check-option vehicle-report-option hidden">

            <input
                type="checkbox"
                id="reportShowTotalVehicleCost">

            Συνολικό κόστος οχήματος ανά km

        </label>

    </div>


    <button
        type="button"
        id="generateReportButton"
        class="primary">

        Δημιουργία Report

    </button>

</section>

</main>

</div>


<!-- =====================================================
     SETTINGS
     ===================================================== -->

<div
    id="settingsModal"
    class="modal hidden"
    aria-hidden="true">

    <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle">


        <div class="modal-header">

            <div>

                <h2 id="settingsTitle">
                    Ρυθμίσεις
                </h2>

                <p class="muted">
                    Παράμετροι εφαρμογής
                </p>

            </div>


            <button
                type="button"
                id="closeSettings"
                class="secondary"
                aria-label="Κλείσιμο">

                ×

            </button>

        </div>


        <!-- ΚΑΤΗΓΟΡΙΕΣ -->

        <div class="settings-section">

            <h3>
                Κατηγορίες
            </h3>

            <div id="categorySettings"></div>

            <div class="add-row">

                <input
                    type="text"
                    id="newCategory"
                    placeholder="Νέα κατηγορία">

                <button
                    id="addCategory"
                    class="settings-add">

                    +

                </button>

            </div>

        </div>


        <!-- ΥΠΟΚΑΤΗΓΟΡΙΕΣ -->

        <div class="settings-section">

            <h3>
                Υποκατηγορίες αγορών
            </h3>

            <div id="subcategorySettings"></div>

            <div class="add-row">

                <input
                    type="text"
                    id="newSubcategory"
                    placeholder="Νέα υποκατηγορία">

                <button
                    id="addSubcategory"
                    class="settings-add">

                    +

                </button>

            </div>

        </div>


        <!-- ΤΡΟΠΟΙ ΠΛΗΡΩΜΗΣ -->

        <div class="settings-section">

            <h3>
                Τρόποι πληρωμής
            </h3>

            <div id="paymentSettings"></div>

            <div class="add-row">

                <input
                    type="text"
                    id="newPayment"
                    placeholder="Νέος τρόπος πληρωμής">

                <button
                    id="addPayment"
                    class="settings-add">

                    +

                </button>

            </div>

        </div>


        <!-- ΓΙΑ ΠΟΙΟΝ -->

        <div class="settings-section">

            <h3>
                Για ποιον
            </h3>

            <div id="personSettings"></div>

            <div class="add-row">

                <input
                    type="text"
                    id="newPerson"
                    placeholder="Νέα επιλογή">

                <button
                    id="addPerson"
                    class="settings-add">

                    +

                </button>

            </div>

        </div>


        <!-- ΟΧΗΜΑΤΑ -->

        <div class="settings-section">

            <h3>
                Οχήματα
            </h3>

            <div id="vehicleSettings"></div>


            <div class="vehicle-add-form">

                <select id="newVehicleType">

                    <option value="Αυτοκίνητο">
                        Αυτοκίνητο
                    </option>

                    <option value="Μηχανή">
                        Μηχανή
                    </option>

                </select>


                <input
                    id="newVehicleMake"
                    type="text"
                    placeholder="Μάρκα">


                <input
                    id="newVehicleModel"
                    type="text"
                    placeholder="Μοντέλο / Τύπος">


                <input
                    id="newVehiclePlate"
                    type="text"
                    placeholder="Πινακίδα">


                <button
                    id="addVehicle"
                    class="settings-add">

                    Προσθήκη οχήματος

                </button>

            </div>

        </div>


        <div class="modal-actions">

            <button
                id="exportData"
                class="secondary">

                Εξαγωγή δεδομένων

            </button>


            <button
                id="importDataButton"
                class="secondary">

                Εισαγωγή δεδομένων

            </button>


            <input
                id="importData"
                type="file"
                accept="application/json"
                class="hidden">


            <button
                id="resetSettings"
                class="danger">

                Επαναφορά ρυθμίσεων

            </button>

        </div>

    </div>

</div>


<script src="app.js"></script>

<script src="reports.js"></script>

<script src="report-vehicle.js"></script>

</body>
</html>
